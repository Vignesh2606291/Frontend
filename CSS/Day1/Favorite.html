<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Things</title>
</head>
<body>
     <div style="background-color: rgb(223, 38, 38); text-align: center;">
        <h2>My Favorite Food</h2>
        <img src="food.jpg" alt="food" width="300" height="200">
        <hr>
     </div>
     <div style="background-color: chocolate; text-align: center;">
         <h2>My Favorite Place</h2>
        <img src="cricket.jpg" alt="cricket" width="300" height="200">
        <hr>
     </div>
     <style>
        .Actor{
            background-color: aqua;
            text-align: center;
        }
        .Sports{
            background-color: darkblue;
            text-align: center;
        }
        .Movie{
            background-color:rgb(216, 91, 7);
            text-align: center;
        }
     </style>
     <div class="Actor">
        <h2>My Favorite Actor</h2>
        <img src="Ajith-1.jpg" alt="photo" width="300" height="200">
        <hr>
     </div>
     <div class="Sports">
         <h2>My Favorite Sports</h2>
        <img src="sports.jpg" alt="cricket" width="300" height="200">
        <hr>
     </div>
     <div class="Movie">
        <h2>My Favorite Movie</h2>
        <img src="vidamuyarchi-2.jpg" alt="cricket" width="300" height="200">
        <hr>
     </div>
</body>
</html>
