<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job-Application-Form</title>
</head>
<body>
    <center><h2>Job-Application-Form</h2></center>
    <br/>
    <form method="post">
            <label>Enter The Name :</label>
        <input type="text" name="Enter The Name" placeholder="Enter Name" required><br /><br />
        <label>Contact Number :</label>
        <input type="number" name="Contact Number" placeholder="Enter The Phone Number" required><br/><br/>
        <label>Enter The Email :</label>
        <input type="email" name="Enter The Email" placeholder="Enter email" required><br/><br/>
        <label>Gender :</label>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female <br/><br/>
        <label>Skills :</label>
        <input type="checkbox" name="Skills">HTML
        <input type="checkbox" name="Skills">JS
        <input type="checkbox" name="Skills">CSS
        <input type="checkbox" name="Skills">REACT <br/><br />
        <label>Resume :</label>
        <input type="file" name="Resume" required><br/><br/>
        <label>Address :</label>
        <br />
        <textarea rows="5" cols="20">Address :</textarea><br/><br/>
        <input type="submit" name="Submit">



    </form>
</body>
</html>
