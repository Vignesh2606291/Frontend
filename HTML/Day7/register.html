<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register-form</title>
</head>
<body>
    <center>
        <h2>Register-form</h2>
    </center>
    <form method="post">
          <center>
              <label style="margin-right: 20px;">Enter The Name :</label>
            <input type="text" name="Enter The Name" placeholder="Enter The Name" required/><br /><br /> 
             <label style="margin-right: 20px;">Enter The Age :</label>
             <input type="number" name="Enter The Age" min="18" max="45" placeholder="18-above" required><br /><br />
            <label>Enter The Phone Number :</label>
            <input style="margin-right: 20px;" type="tel" name="Enter the Phone Number" placeholder="10-Digits" required><br /><br />
            <label style="margin-right: 20px;">Enter The Email :</label>
            <input type="email" name="Enter The Email" placeholder="E-mail" required><br/><br/>
            <input type="submit" name="Register">
    </form>
          </center>
</body>
</html>
