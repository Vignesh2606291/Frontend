<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback-form</title>
</head>
<body>
    <center>
        <h2>feedback-Form</h2>
        <br />
        <form method="post">
        <label style="margin-right: 20px;">Enter The Name :</label>
        <input type="text" name="Enter The Name" placeholder="Enter Full Name" required><br/><br/>
        <label style="margin-right: 20px;">Enter The Phone Number :</label>
        <input type="number" name="Enter The Phone Number" placeholder="Phone Number" required><br/><br/>
        <label style="margin-right: 20px;">Enter The Email :</label>
        <input type="email" name="Enter The Email" placeholder="enter email" required><br/><br/>
        <label style="margin-right: 20px;">Rating :</label>
        <input type="radio" name="Rating">Good
          <input type="radio" name="Rating">Average
            <input type="radio" name="Rating">Bad
            <br/><br/>
            <label style="margin-right: 20px;">Feedback :</label>
            <textarea rows="5" cols="30"></textarea>
            <br/><br />
            <input type="submit" name="submit" required>
    </form>
    </center>
</body>
</html>
