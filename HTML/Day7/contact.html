<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact-form</title>
</head>
<body>
    <center><h2>Contact-form</h2></center>
    <br/>
    <form method="post">
        <center>
            <label style="margin-right: 20px;">Enter The Name :</label>
            <input type="text" name="Enter The Name" placeholder="Enter The Name" required><br/><br/>
            <label style="margin-right: 20px;">Enter The Phone Number :</label>
            <input type="number" name="Enter The Phone Number" minlength="10" maxlength="10" placeholder="Enter Your Phone Number" required><br/><br/>
            <label style="margin-right: 20px;">Enter The Age :</label>
            <input type="number" name="Enter The Age" min="18" max="50" placeholder="18-above"><br/><br/>
            <label>Gender :</label>
            <input type="radio" name="Gender">male
            <input type="radio" name="Gender">female <br/><br />
            <label style="margin-right: 20px;">Enter The Email :</label>
            <input type="email" name="Enter The Email" placeholder="Enter Your Email" required><br/><br/>
            <label style="margin-right: 20px;">Enter Your Password :</label>
            <input type="password" name="Enter Your Password" placeholder="Enter Your Password" required><br/><br/>
            <input type="submit" name="Submit">
            
        </center>
     </form>
</body>
</html>
