<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav bar Bootstrap</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Logo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Categories</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <div id="productCarousel"
         class="carousel slide"
         data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="assets/images/1.png" class="d-block w-100"  alt="Sale">
            </div>

            <div class="carousel-item">
                <img src="assets/images/2.png" class="d-block w-100" alt="Products">
            </div>

            <div class="carousel-item">
                <img src="assets/images/3.png" class="d-block w-100" alt="Shopping">
            </div>

        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <div class="container my-5">

        <h2 class="text-center mb-4">Our Products</h2>

        <div class="row g-4">

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100">
                    <img src="assets/images/11.png" class="card-img-top" alt="Smart Watch">
                    <div class="card-body text-center">
                      <h5 class="card-title"> Smart Watch</h5>
                      <p class="card-text"> ₹1,499</p>
                      <button class="btn btn-primary"> Buy Now</button>
                    </div>
                </div>
            </div>



            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100">
                    <img src="assets/images/12.png" class="card-img-top" alt="Headphones">
                    <div class="card-body text-center">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text">₹999</p>
                        <button class="btn btn-primary"> Buy Now</button>
                    </div>
                </div>

            </div>


            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100">
                    <img src="assets/images/13.png" class="card-img-top" alt="powerbank">
                    <div class="card-body text-center">
                        <h5 class="card-title">PowerBank</h5>
                        <p class="card-text">₹1,999</p>
                        <button class="btn btn-primary"> Buy Now</button>
                    </div>
                </div>
            </div>


            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100">
                    <img src="assets/images/14.png" class="card-img-top" alt="speaker">
                    <div class="card-body text-center">
                        <h5 class="card-title">Speaker</h5>
                        <p class="card-text">₹5,499</p>
                        <button class="btn btn-primary">Buy Now</button>
                    </div>
                </div>
            </div>

        </div>

    </div>


    <div class="container my-5">

        <h2 class="text-center mb-4">Contact Us </h2>

        <form class="mx-auto" style="max-width: 600px;">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>


            <div class="mb-3">
                <label class="form-label"> Email</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>


            <div class="mb-3">
                <label class="form-label"> Message </label>
                <textarea class="form-control" rows="4" placeholder="Enter your message"></textarea>
            </div>

            <button type="submit" class="btn btn-success"> Submit </button>

        </form>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
