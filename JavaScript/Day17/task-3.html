<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #productContainer {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .product-card {
            background-color: #f9fafb;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }

        .product-card h3 {
            color: #2563eb;
            margin-top: 0;
        }

        .product-card p {
            color: #444;
        }

        @media (max-width: 500px) {
            #productContainer {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Product Details</h2>

        <form id="productForm">

            <input
                type="text"
                id="productName"
                placeholder="Product Name"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Price"
                required
            >

            <input
                type="text"
                id="category"
                placeholder="Category"
                required
            >

            <button type="submit">Add Product</button>

        </form>

        <div id="productContainer"></div>

    </div>

    <script src="assets/js/task-3.js"></script>

</body>
</html>
