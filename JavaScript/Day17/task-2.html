<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        td {
            background-color: #f9fafb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Employee Details</h2>

        <form id="employeeForm">

            <input
                type="text"
                id="employeeName"
                placeholder="Employee Name"
                required
            >

            <input
                type="text"
                id="department"
                placeholder="Department"
                required
            >

            <input
                type="number"
                id="salary"
                placeholder="Salary"
                required
            >

            <button type="submit">Add Employee</button>

        </form>

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Salary</th>
                </tr>
            </thead>

            <tbody id="employeeTable">

            </tbody>

        </table>

    </div>

    <script src="assets/js/task-2.js"></script>

</body>
</html>
