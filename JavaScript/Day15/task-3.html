<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toggle Theme</title>

    <style>
        /* Normal card */
        .card {
            width: 300px;
            padding: 30px;
            margin: 50px auto;
            text-align: center;

            background-color: white;
            color: black;

            border: 2px solid black;
            border-radius: 10px;
        }

        /* Dark theme */
        .dark {
            background-color: #222;
            color: white;
            border-color: white;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card" id="card">
        <h2>My Card</h2>
        <p>This is a theme toggle example.</p>

        <button id="btn">Toggle Theme</button>
    </div>

    <script src="assets/js/task-3.js"> </script>

</body>

</html>
